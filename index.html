<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b101a">
<title>ATシミュレーター</title>
<style>
  :root {
    color-scheme: dark;
    font-family: system-ui, sans-serif;
    color: #f4f5ff;
    background: #0b101a;
    --muted: #aebbd0;
    --line: #303d52;
    --gold: #ffce76;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at top, #1f2b45, transparent 600px); }
  main { width: min(100%, 760px); margin: auto; padding: 24px 12px 40px; }
  header { margin: 0 4px 14px; }
  h1 { margin: 0; font-size: clamp(1.35rem, 5vw, 2rem); letter-spacing: .07em; }
  h2 { margin: 0; font-size: 1rem; }
  .machine { padding: clamp(6px, 2vw, 14px); border: 1px solid #485772; border-radius: 20px;
    background: linear-gradient(160deg, #202c42, #101725 60%); box-shadow: 0 18px 45px #0007; }
  .lcd { position: relative; isolation: isolate; display: flex; flex-direction: column;
    justify-content: space-between; aspect-ratio: 16 / 9; overflow: hidden;
    border: 1px solid #6d809c; border-radius: 13px; padding: clamp(8px, 2vw, 18px);
    background: #132742 url("img/normal.jpg") center / cover; }
  .lcd::before { content: ""; position: absolute; z-index: -1; inset: 0; pointer-events: none;
    background: linear-gradient(#030812e8, #03081228 42%, transparent 55%, #030812e8); }
  .lcd[data-mode="cz"] { background-image: url("img/cz.jpg"); }
  .lcd[data-mode="special"] { background-image: url("img/tokka.jpg"); }
  .lcd[data-mode="freeze"] { background-image: url("img/freeze.jpg"); }
  .lcd[data-mode="ending"] { background-image: url("img/ending.jpg"); }
  .lcd[data-mode="end"] { background-image: url("img/end.jpg"); }
  .hud { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
  .hud > :nth-child(2) { text-align: center; }
  .hud > :last-child { text-align: right; }
  .label, .detail { display: block; color: #d6e1f2; font-size: clamp(.75rem, 2.8vw, .95rem); }
  .number { font-size: clamp(1rem, 4.6vw, 2.15rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  #net { color: var(--gold); }
  .unit { font-size: clamp(.7rem, 2.6vw, .9rem); }
  .lcd-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 4px; }
  #mode { text-align: right; color: #fff4dc; font-weight: 800; font-size: clamp(.95rem, 4vw, 1.65rem);
    text-shadow: 0 2px 8px #000; }
  .outcome { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 10px 0; padding: 8px 10px; min-height: 54px; border: 1px solid var(--line);
    border-radius: 11px; background: #0b111b; font-variant-numeric: tabular-nums; }
  #role { padding: 4px 9px; border-radius: 6px; background: #253147; color: #fff; font-weight: 750; }
  #role[data-role="押し順ベル"], #role[data-role="チャンス目"] { background: #ffce76; color: #251909; }
  #role[data-role="チェリー"] { background: #992c4c; }
  #role[data-role="スイカ"] { background: #205d43; }
  #role[data-role="リプレイ"], #role[data-role="中段チェリー"] { background: #245581; }
  .payout { color: var(--muted); font-size: .86rem; text-align: right; }
  #payout { color: #f4f5ff; font-size: 1.05rem; font-weight: 700; }
  .zone-bar { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    margin: 0 2px 8px; font-variant-numeric: tabular-nums; }
  .zone-bar .label { font-size: .85rem; }
  .zone-bar .number { font-size: 1.25rem; }
  .controls { display: grid; grid-template-columns: .88fr 1fr 1.46fr; gap: 7px; align-items: center; }
  button, input { font: inherit; border-radius: 9px; }
  button { cursor: pointer; padding: 5px; color: #f4f5ff; border: 1px solid #536987;
    background: #26354b; font-weight: 750; line-height: 1.25;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button:disabled { opacity: .48; cursor: default; }
  #one { min-height: 72px; background: linear-gradient(#ffdf9e, #f1ac49);
    color: #241606; border-color: #ffdc96; font-size: 1.15rem; box-shadow: inset 0 -4px #ad65284d; }
  #ten { min-height: 60px; font-size: .95rem; }
  #until { min-height: 50px; font-size: .8rem; }
  .session { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-top: 16px; }
  .session label { display: grid; gap: 5px; color: var(--muted); font-size: .88rem; }
  input { width: 100%; min-height: 46px; border: 1px solid var(--line); padding: 8px 10px;
    background: #101827; color: #f4f5ff; font-variant-numeric: tabular-nums; }
  .session button { min-height: 46px; padding: 6px 12px; font-size: .9rem; }
  .log { margin-top: 20px; padding: 13px; background: #101827; border: 1px solid var(--line); border-radius: 12px; }
  #log { list-style: none; margin: 8px 0 0; padding: 0; color: #d6e1f2; font-size: .9rem; }
  #log li { display: flex; gap: 10px; padding: 5px 0; }
  #log li + li { border-top: 1px solid #263248; }
  #log .log-game { flex: 0 0 7ch; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
<script src="sim.js" defer></script>
</head>
<body>
<main>
  <header><h1>ATシミュレーター</h1></header>
  <section class="machine" aria-label="AT操作">
    <div class="zone-bar"><span class="label">有利区間差枚</span><span><strong class="number" id="zone-net">0</strong> <span class="unit">枚</span></span></div>
    <div class="lcd" id="lcd">
      <div class="hud">
        <div><span class="label">残りAT</span><strong class="number" id="remaining">100</strong> <span class="unit">G</span></div>
        <div><span class="label">獲得差枚</span><strong class="number" id="net">0</strong> <span class="unit">枚</span></div>
        <div><span class="label">カウンタ</span><strong class="number" id="counter"></strong><span class="detail" id="count-rule">プラス差枚加算</span></div>
      </div>
      <div class="lcd-bottom">
        <div><span class="label">残りVストック</span><strong class="number" id="stocks">0</strong>
          <span class="detail" id="stock-detail">弱 0 ／ 強 0</span></div>
        <div><div id="mode">セット消化</div><div class="detail" id="set-info" style="text-align:right"></div></div>
      </div>
    </div>
    <div class="outcome" aria-live="polite">
      <span class="detail" id="game">0 G</span>
      <span id="role">—</span>
      <span class="payout">払出 <span id="payout">—</span> 枚</span>
    </div>
    <div class="controls">
      <button type="button" id="until">次のCZまで進む</button>
      <button type="button" id="ten">10G進む</button>
      <button type="button" id="one">1G進む</button>
    </div>
  </section>
  <form class="session" id="session-form">
    <label>シード<input id="seed" value="20261118" type="text" pattern="[+\-]?[0-9]+" spellcheck="false" autocomplete="off" required></label>
    <button id="new-at">新しいATを開始</button>
  </form>
  <section class="log" aria-labelledby="log-title">
    <h2 id="log-title">直近の出来事</h2>
    <ol id="log"></ol>
  </section>
</main>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const byId = id => document.getElementById(id);
    const modeNames = {
      set: "セット消化", cz: "CZ", special: "特化ゾーン", freeze: "フリーズ",
      return: "引き戻し待ち", ending: "エンディング", end: "AT終了",
    };
    const eventText = {
      ending: () => "エンディング突入",
      stock: ({ weak, strong }) => `Vストック獲得（弱 ${weak}・強 ${strong}）`,
      pool: ({ count }) => `プール +${count}`,
      cz: ({ fromTable }) => fromTable ? "カウンタ到達でCZ突入" : "レア役からCZ突入",
      special: ({ frozen }) => frozen ? "フリーズ特化ゾーン突入" : "特化ゾーン突入",
      freeze: ({ addedGames }) => `フリーズ（${addedGames}G）`,
      addedGames: ({ games }) => `AT +${games}G`,
      acceleration: ({ multiplier }) => `カウンタ加速 ×${multiplier}`,
      cut: () => "有利区間切断",
      restart: () => "新しい有利区間でAT再開",
      returnWindow: () => "32Gの引き戻し待ちへ",
      directEntry: () => "中段チェリーからATに直撃",
      return: () => "プールからATに復帰",
      stockSet: ({ rate }) => `純増${rate}枚のセット開始`,
      end: () => "AT終了",
    };
    const buttons = ["one", "ten", "until"].map(byId);
    const log = byId("log");
    const lcd = byId("lcd");
    const role = byId("role");
    const count = new Intl.NumberFormat("ja-JP");
    const signed = new Intl.NumberFormat("ja-JP", { signDisplay: "exceptZero" });
    let session;
    let last;
    let busy = false;

    // Load the six scenes before they are needed during play.
    for (const scene of ["normal", "cz", "tokka", "freeze", "ending", "end"]) {
      new Image().src = `img/${scene}.jpg`;
    }

    function addLog(game, message) {
      const item = document.createElement("li");
      const time = document.createElement("span");
      time.className = "log-game";
      time.textContent = `${count.format(game)} G`;
      item.append(time, message);
      log.prepend(item);
      if (log.children.length > 8) log.lastElementChild.remove();
    }

    function render() {
      const state = session.state;
      const { acceleration, stocks } = state;
      lcd.dataset.mode = state.mode;
      byId("mode").textContent = modeNames[state.mode];
      byId("remaining").textContent = count.format(state.remaining);
      byId("net").textContent = signed.format(state.net);
      byId("zone-net").textContent = signed.format(state.zoneNet);
      byId("counter").textContent = `${state.counter}／${state.threshold}`;
      byId("count-rule").textContent = acceleration.remaining && !acceleration.inPrelude
        ? `プラス差枚 ×${acceleration.multiplier}（残り${acceleration.remaining}G）` : "プラス差枚加算";
      byId("stocks").textContent = count.format(stocks.weak + stocks.strong);
      byId("stock-detail").textContent = `弱 ${stocks.weak} ／ 強 ${stocks.strong}`;
      byId("set-info").textContent = `純増${state.rate}枚 · テーブル${state.table}`;
      byId("game").textContent = `${count.format(state.game)} G`;
      role.textContent = last?.role ?? "—";
      role.dataset.role = last?.role ?? "";
      byId("payout").textContent = last?.payout ?? "—";
      for (const button of buttons) button.disabled = busy || state.done;
      byId("new-at").disabled = busy;
    }

    async function advance(limit, untilCz = false) {
      if (busy || session.state.done) return;
      busy = true;
      render();
      try {
        for (let i = 0; i < limit; i++) {
          last = session.step();
          for (const event of last.events) addLog(last.game, eventText[event.type](event));
          if (session.state.done || (untilCz && last.events.some(event => event.type === "cz"))) break;
          if ((i + 1) % 100 === 0) {
            render();
            await new Promise(resolve => setTimeout(resolve, 0));
          }
        }
      } finally {
        busy = false;
        render();
      }
    }

    function start() {
      if (busy) return;
      session = ATSimulator.createSession(byId("seed").value);
      last = null;
      log.replaceChildren();
      addLog(0, "AT開始");
      render();
    }

    byId("session-form").addEventListener("submit", event => {
      event.preventDefault();
      start();
    });
    const tap = (button, action) => button.addEventListener("pointerdown", event => {
      event.preventDefault();
      action();
    });
    tap(byId("one"), () => advance(1));
    tap(byId("ten"), () => advance(10));
    tap(byId("until"), () => advance(Infinity, true));
    start();
  });
</script>
</body>
</html>
